{% extends "base.html" %}

{% block title %}Page Not Found | Plant AI{% endblock %}

{% block content %}
<div class="container page-container text-center py-5">
    <div class="card p-5" style="max-width: 600px; margin: 40px auto;">
        <div class="empty-icon text-warning mb-3" style="font-size: 4rem;">
            <i class="fa-solid fa-leaf-falling"></i>
        </div>
        <h1 class="mb-2">404 - Page Not Found</h1>
        <p class="text-muted mb-4">{{ message or "The page or record you are looking for does not exist." }}</p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="fa-solid fa-house"></i> Return to Home
            </a>
            <a href="{{ url_for('detect') }}" class="btn btn-outline btn-lg">
                <i class="fa-solid fa-camera"></i> Detect Disease
            </a>
        </div>
    </div>
</div>
{% endblock %}
